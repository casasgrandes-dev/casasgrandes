name: CHG-025 PostgreSQL gate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/chg025-postgres.yml'
      - 'db.js'
      - 'server.js'
      - 'utils/commercialFlow.js'
      - 'test/chg025_postgres_reservations.test.js'
      - 'package.json'
      - 'package-lock.json'

jobs:
  reservation-concurrency:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: casas_grandes_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d casas_grandes_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      CHG025_TEST_POSTGRES_URL: postgres://postgres@127.0.0.1:5432/casas_grandes_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run test:chg025:postgres
